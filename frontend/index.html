<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Alunos - SIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header class="topo">
    <div class="topo-conteudo">
      <div class="logo">🎓</div>
      <div>
        <h1>Gestão de Alunos</h1>
        <p>IPVC · ESTG — Sistemas de Informação em Rede</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Formulário -->
    <section class="card">
      <h2 id="form-title">Adicionar Aluno</h2>
      <form id="aluno-form">
        <input type="hidden" id="aluno-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required placeholder="Ex.: Joana">
          </div>
          <div class="form-group">
            <label for="apelido">Apelido</label>
            <input type="text" id="apelido" required placeholder="Ex.: Silva">
          </div>
          <div class="form-group">
            <label for="idCurso">Curso</label>
            <select id="idCurso" required>
              <option value="">Selecione um curso</option>
            </select>
          </div>
          <div class="form-group">
            <label for="anoCurricular">Ano Curricular</label>
            <select id="anoCurricular" required>
              <option value="1">1º Ano</option>
              <option value="2">2º Ano</option>
              <option value="3">3º Ano</option>
              <option value="4">4º Ano</option>
            </select>
          </div>
          <div class="form-group">
            <label for="idade">Idade</label>
            <input type="number" id="idade" min="16" max="99" placeholder="Ex.: 20">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn-primary">Adicionar</button>
          <button type="button" id="btn-cancel" class="btn-secondary" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Lista de alunos -->
    <section class="card">
      <div class="lista-topo">
        <h2>Lista de Alunos <span id="contador" class="contador"></span></h2>
        <div class="filtro">
          <label for="filtro-curso">Ver alunos do curso</label>
          <select id="filtro-curso">
            <option value="">Todos os cursos</option>
          </select>
        </div>
      </div>

      <table id="tabela-alunos">
        <thead>
          <tr>
            <th>Aluno</th>
            <th>Curso</th>
            <th>Ano</th>
            <th>Idade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-alunos">
          <tr><td colspan="5" class="loading">A carregar alunos...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
