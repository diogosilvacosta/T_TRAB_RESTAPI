<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Alunos - SIR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gestão de Alunos</h1>

    <section class="form-section">
      <h2 id="form-title">Adicionar Aluno</h2>
      <form id="aluno-form">
        <input type="hidden" id="aluno-id">
        <div class="form-row">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required placeholder="Nome">
          </div>
          <div class="form-group">
            <label for="apelido">Apelido</label>
            <input type="text" id="apelido" required placeholder="Apelido">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="idCurso">Curso</label>
            <select id="idCurso" required>
              <option value="">Selecione um curso</option>
            </select>
          </div>
          <div class="form-group">
            <label for="anoCurricular">Ano Curricular</label>
            <select id="anoCurricular" required>
              <option value="1">1º Ano</option>
              <option value="2">2º Ano</option>
              <option value="3">3º Ano</option>
              <option value="4">4º Ano</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="idade">Idade</label>
          <input type="number" id="idade" min="16" max="99" required placeholder="Idade">
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-submit">Adicionar</button>
          <button type="button" id="btn-cancel" class="btn-secondary" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="table-section">
      <h2>Lista de Alunos</h2>
      <div class="table-container">
        <table id="tabela-alunos">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Apelido</th>
              <th>Curso</th>
              <th>Ano</th>
              <th>Idade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-alunos">
            <tr><td colspan="7" class="loading">A carregar alunos...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
